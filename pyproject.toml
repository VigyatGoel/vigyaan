[project]
name = "Vigyaan"
version = "0.1.0"
description = "Vigyaan is an all-in-one application for rapid exploratory data analysis, interactive visualizations, and baseline machine learning model training"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "slowapi>=0.1.9",
    "streamlit>=1.57.0",
    "watchdog>=6.0.0",
]
